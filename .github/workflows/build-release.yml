name: Build Android APK & Create Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: concrete-calculator-v1.0-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "حاسبة العينات الخرسانية v1.0.0"
          body: |
            ## 🏗️ حاسبة العينات الخرسانية - الإصدار 1.0.0 (v1.0)

            يسرنا تقديم الإصدار الأول من تطبيق **حاسبة العينات الخرسانية** المخصص للمهندسين والمشرفين الإنشائيين.

            ### 🌟 أبرز مميزات هذا الإصدار:
            - 🧪 **حاسبة مواعيد كسر الخرسانة**: حساب تلقائي لمواعيد 7 أيام، 28 يوم، و **56 يوم** للخرسانات الخاصة.
            - 📅 **حاسبة الفرق بين تاريخين**: حساب الأيام والأسابيع والسنوات مع أزرار إضافة سريعة (+7, +28, +56 يوم).
            - 🗄️ **سجل العينات المحفوظة**: قاعدة بيانات محلية (Room DB) لحفظ ومتابعة صبات المشروع مع خيارات البحث والفلترة.
            - 📲 **مشاركة تقرير العينة**: مشاركة تفاصيل المواعيد والملاحظات بنص منسق.
            - 🎨 **واجهة Samsung One UI**: تصميم عالي التجاوب يدعم اتجاه النص العربي (RTL).

            ---
            📥 **تحميل التطبيق**: يمكنك تحميل ملف الـ APK المرفق بأسفل الصفحة وتثبيته مباشرة.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
